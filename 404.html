<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found | Jonathan Velez</title>
  <script>try{var t=localStorage.getItem('jv-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css?family=Roboto|Roboto+Mono" rel="stylesheet">
  <!-- absolute paths: this page is served for any missing URL, at any depth -->
  <link rel="stylesheet" href="/assets/css/themes.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      background-color: #4a4cb3;
      background-color: var(--accent, #6d56c1);
      font-family: 'Roboto', Arial, sans-serif;
      color: #ffffff;
    }

    .not-found {
      position: relative;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      box-sizing: border-box;
      background: linear-gradient(54deg, var(--grad-a, rgba(74, 76, 179, 0.95)) 34%, var(--grad-b, rgba(205, 160, 160, 0.95)));
    }

    .not-found__inner {
      max-width: 560px;
    }

    .not-found__code {
      margin: 0;
      font-family: 'Roboto Mono', monospace;
      font-size: clamp(72px, 18vw, 128px);
      line-height: 1;
      font-weight: 700;
      opacity: 0.9;
    }

    .not-found__title {
      margin: 16px 0 12px;
      font-family: 'Roboto Mono', monospace;
      font-size: 24px;
      line-height: 32px;
    }

    .not-found__text {
      margin: 0 0 32px;
      font-size: 18px;
      line-height: 28px;
      color: rgba(255, 255, 255, 0.85);
    }

    .not-found__links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .not-found__links a {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 999px;
      background-color: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-family: 'Roboto Mono', monospace;
      font-size: 15px;
      text-decoration: none;
      transition: background-color 0.2s, color 0.2s;
    }

    .not-found__links a:hover,
    .not-found__links a:focus-visible {
      background-color: #ffffff;
      color: var(--accent, #6d56c1);
    }
  </style>
</head>

<body>
  <main class="not-found">
    <div class="not-found__inner">
      <p class="not-found__code">404</p>
      <h1 class="not-found__title">This page doesn't exist</h1>
      <p class="not-found__text">The link may be old or mistyped. Everything on the site is one click away from the home page.</p>
      <ul class="not-found__links">
        <li><a href="/">Home</a></li>
        <li><a href="/#portfolio">Projects</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </div>
  </main>
</body>

</html>
